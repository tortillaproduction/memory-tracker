name: Keep alive

# Renderの無料枠は約15分無アクセスでスリープし、通知バッチも止まるため、
# 定期的に/healthzを叩いてインスタンスを起こし続ける。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not set" >&2
            exit 1
          fi
          curl -fsS --max-time 60 --retry 3 --retry-delay 10 "${BACKEND_URL%/}/healthz"
